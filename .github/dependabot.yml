version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/apps/web", "/packages/contracts"]
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    groups:
      next-react:
        patterns:
          ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      - dependency-name: "hardhat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nomicfoundation/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hardhat-deploy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/chai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fhevm/*"
      - dependency-name: "@zama-fhe/relayer-sdk"
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
