pre-commit:
  piped: true
  jobs:
    - name: branch guard
      run: |
        case "$(git branch --show-current)" in
          dev|staging|main) echo "Commits never go straight to dev, staging or main. Work on a feature branch in a worktree; see AGENTS.md."; exit 1 ;;
        esac
    - name: format
      glob: "*.{js,mjs,cjs,ts,tsx,json,jsonc,css,md,yml,yaml,sol}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: comments
      glob: "*.{ts,tsx,js,mjs,cjs,css,sol}"
      run: node scripts/check-comments.mjs {staged_files}
    - name: copy
      glob: "apps/web/src/**/copy.ts"
      run: node scripts/check-copy.mjs {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: preflight
      run: ./scripts/preflight.sh --fast
